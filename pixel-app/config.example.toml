# Copie ce fichier en config.toml, puis remplis ce qui te concerne.

[weather]
city = "Paris"              # ou bien : latitude = 48.85 et longitude = 2.35

[agenda]
# Le plus simple : ajoute tes agendas depuis ton téléphone, page « Agendas » de l'appli.
# Tu peux aussi les mettre ici. Google Agenda : Paramètres > ton agenda > « Intégrer l'agenda »
# > « Adresse secrète au format iCal ». Plusieurs adresses possibles (Google, iCloud, Outlook…).
ics = []

[hue]
# Laisse vide : sur l'écran Réglages, la touche ASSOCIER HUE trouve le pont toute seule.
# bridge = "192.168.1.20"

[claude]
model = "claude-opus-5-5"
effort = "low"              # low = réponses rapides ; medium ou high pour qu'il réfléchisse plus
# Avec ton abonnement Claude au lieu d'une clé API (CLAUDE_CODE_OAUTH_TOKEN dans /etc/pixel.env, voir le README) :
# backend = "abonnement"    # ou "api". Sans cette ligne : l'abonnement s'il y a un jeton et pas de clé API.
# abonnement_model = "claude-sonnet-5-5"   # plus léger qu'Opus : ton quota dure plus longtemps

[codex]
# La tâche tapée est ajoutée à la fin de la commande.
command = ["codex", "exec", "--full-auto"]
workdir = "~/projets"
# Avec Claude Code à la place : command = ["claude", "-p"]

[streamdeck]
brightness = 70             # 0 à 100

[ui]
sleep_minutes = 10          # Pixel s'endort sur le visage après ce temps sans rien
theme = "retro"             # le thème au démarrage
# Les thèmes que Pixel propose (Réglages, touches Thème − / +, commande « thème »). Pour le moment : Rétro seulement.
# Pour les retrouver tous : themes = ["retro", "moderne", "manga", "neon", "croquis", "lcd"]
themes = ["retro"]

[cast]
# « Caster sur Pixel » depuis le téléphone (photo, GIF, vidéo, texte, lien) : voir docs/CAST.md.
max_mb = 40                 # la taille maximale d'un fichier envoyé, en Mo
seconds = 120               # combien de temps une photo, un GIF, un texte ou un lien reste affiché (0 : jusqu'à « Arrêter ») ; une vidéo va jusqu'au bout
keep = 8                    # les derniers fichiers gardés dans le dossier de données (cast/), à réafficher depuis le téléphone

[ecran]
# « Partager mon écran » : l'écran d'un ordinateur (ou d'un téléphone) en direct sur Pixel, voir docs/CAST.md.
# https_port = 8443         # une adresse https en plus (https://pixel.local:8443/ecran), avec le certificat que fait install.sh

[airplay]
# La « Recopie de l'écran » d'un iPhone, d'un iPad ou d'un Mac, avec UxPlay. À installer d'abord :
# PIXEL_AIRPLAY=1 sh deploy/install.sh (voir docs/CAST.md), puis enabled = true.
enabled = false
name = "Pixel"              # son nom dans la liste « Recopie de l'écran »
pin = true                  # l'iPhone tape le code à 4 chiffres que Pixel affiche (sans lui, tout le Wi-Fi peut s'afficher sur Pixel)
# args = ["-bt709"]         # Pi 4 : si les couleurs sont fausses ; ["-avdec"] : décoder la vidéo avec le processeur

# [security]
# token = "..."             # code d'accès des téléphones ; créé tout seul sinon
