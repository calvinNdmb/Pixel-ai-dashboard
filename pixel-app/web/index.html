<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#d9d2bd">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pixel">
<title>Pixel</title>
<link rel="manifest" href="app/manifest.webmanifest">
<link rel="icon" href="app/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="app/icon-180.png">
<link rel="stylesheet" href="app/style.css">
</head>
<body>
<main class="device">
  <nav class="modes" id="modes" aria-label="Ce que l'appli montre">
    <button type="button" data-mode="pixel">Pixel</button><button type="button" data-mode="clavier">Clavier</button><button type="button" data-mode="both">Les deux</button>
  </nav>
  <div class="monitor">
    <div class="recess"><div class="screen" id="screen">
      <canvas id="crt" width="1600" height="960" aria-label="Écran de Pixel"></canvas>
      <form class="cmd" id="cmdForm" autocomplete="off">
        <label for="cmd">C:\PIXEL&gt;</label>
        <input id="cmd" name="cmd" type="text" enterkeyhint="send" spellcheck="false" placeholder="tape une commande ou une question">
      </form>
      <div class="osk" id="osk" hidden></div>
    </div></div>
    <div class="mfoot"><span class="badge">PIXEL</span><span class="conn" id="conn">connexion…</span></div>
  </div>
  <div class="kb">
    <div class="keys" id="keys"></div>
    <div class="kfoot">
      <span style="display:flex;gap:8px;flex-wrap:wrap"><button type="button" class="follow" id="follow" aria-pressed="true">Miroir de Pixel</button><a class="follow" href="app/reglages.html" style="text-decoration:none">Agendas</a><a class="follow" id="apk" href="/pixel.apk" style="text-decoration:none" hidden>Appli Android</a></span>
      <span class="hint">Tape <b>aide</b> pour la liste des commandes</span>
    </div>
  </div>
  <details class="cast" id="cast">
    <summary>Caster sur Pixel</summary>
    <div class="cast-in">
      <p class="cast-now" id="castNow">Rien à l'écran pour le moment.</p>
      <div class="cast-row">
        <button type="button" class="cbtn big" id="castPick">Photo ou vidéo</button>
        <button type="button" class="cbtn stop" id="castStop" disabled>Arrêter</button>
      </div>
      <input type="file" id="castFile" accept="image/*,video/*" hidden>
      <form class="cast-form" id="castLinkForm" autocomplete="off"><label class="sr" for="castLink">Lien à afficher</label>
        <input id="castLink" type="text" inputmode="url" autocapitalize="off" spellcheck="false" enterkeyhint="send" placeholder="Colle un lien : YouTube, une page, une image…"><button type="submit" class="cbtn">Afficher</button></form>
      <form class="cast-form" id="castTextForm" autocomplete="off"><label class="sr" for="castText">Texte à afficher</label>
        <input id="castText" type="text" maxlength="280" enterkeyhint="send" placeholder="Écris un petit mot"><button type="submit" class="cbtn">Afficher</button></form>
      <div class="cast-opts">
        <label class="ck"><input type="checkbox" id="castRaw"> Couleurs d'origine</label>
        <label class="ck">Durée <select id="castSecs"><option value="">2 min</option><option value="30">30 s</option><option value="600">10 min</option><option value="0">jusqu'à Arrêter</option></select></label>
      </div>
      <p class="cast-msg" id="castMsg" role="status" aria-live="polite"></p>
      <div class="cast-recent" id="castRecent" role="group" aria-label="Les derniers casts"></div>
      <p class="cast-hint">Une photo, une vidéo jusqu'au bout, un texte ou un lien. Touche l'écran de Pixel pour arrêter. Depuis une autre appli : <b>Partager → Pixel</b> (appli installée, voir docs/CAST.md).</p>
    </div>
  </details>
</main>
<script src="app/pack52/pixel52.js"></script>
<script src="app/pack52/pixel52-themes.js"></script>
<script src="app/themes.js"></script>
<script src="app/persona.js"></script>
<script src="app/scenes/notifs.js"></script>
<script src="app/scenes/travail.js"></script>
<script src="app/scenes/toucher.js"></script>
<script src="app/scenes/vie.js"></script>
<script src="app/scenes/surprises.js"></script>
<script src="app/son.js"></script>
<script src="app/screens.js"></script>
<script src="app/app.js"></script>
</body>
</html>
