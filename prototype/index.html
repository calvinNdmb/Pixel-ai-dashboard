<title>Atelier Archipel</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono&display=swap">
<link rel="stylesheet" href="app.css">

<div class="app" id="app">
  <header class="topbar">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="13" class="bm-ring"/><path d="M16 4 L19 16 L16 28 L13 16 Z" class="bm-needle"/><circle cx="16" cy="16" r="2.2" class="bm-dot"/></svg>
      <div class="brand-text">
        <span class="brand-name">Archipel</span>
        <span class="world-name" id="world-name"></span>
      </div>
    </div>
    <nav class="tabs" id="tabs" aria-label="Vues">
      <button class="tab" data-view="entries" id="tab-entries">Fiches</button>
      <button class="tab" data-view="graph" id="tab-graph">Toile</button>
      <button class="tab" data-view="map" id="tab-map">Monde</button>
      <button class="tab" data-view="write" id="tab-write">Manuscrit</button>
    </nav>
    <div class="top-actions">
      <span class="demo-pill" title="Prototype : tes modifications restent dans ce navigateur">Prototype</span>
      <button class="icon-btn" id="theme-btn" aria-label="Changer de thème">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9z"/></svg>
      </button>
    </div>
  </header>

  <div class="body">
    <aside class="sidebar" id="sidebar">
      <div class="side-head">
        <label class="search">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
          <input id="search" type="search" placeholder="Chercher une fiche" autocomplete="off">
        </label>
        <button class="btn btn-accent" id="new-entry">+ Nouvelle fiche</button>
      </div>
      <div class="side-list" id="side-list"></div>
      <div class="side-foot">
        <button class="link-btn" id="home-btn">Vue d'ensemble</button>
        <button class="link-btn" id="reset-btn">Réinitialiser la démo</button>
      </div>
    </aside>

    <main class="main" id="main">
      <section class="view" id="view-entries"></section>
      <section class="view" id="view-graph" hidden></section>
      <section class="view" id="view-map" hidden></section>
      <section class="view" id="view-write" hidden></section>
    </main>
  </div>

  <nav class="bottombar" id="bottombar" aria-label="Vues">
    <button class="btab" data-view="entries" id="btab-entries"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="3.5" width="14" height="17" rx="1.5"/><path d="M8.5 8h7M8.5 12h7M8.5 16h4"/></svg><span>Fiches</span></button>
    <button class="btab" data-view="graph" id="btab-graph"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="6" cy="7" r="2.5"/><circle cx="18" cy="6" r="2.5"/><circle cx="12" cy="18" r="2.5"/><path d="M8.3 8.2l2.6 7.4M15.8 7.3l-2.7 8.4M8.5 6.8l7-.6"/></svg><span>Toile</span></button>
    <button class="btab" data-view="map" id="btab-map"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 6.5l5.5-2 6 2 5.5-2v13l-5.5 2-6-2-5.5 2z"/><path d="M9 4.5v13M15 6.5v13"/></svg><span>Monde</span></button>
    <button class="btab" data-view="write" id="btab-write"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20l1-4L16.5 4.5a2.1 2.1 0 0 1 3 3L8 19z"/><path d="M14.5 6.5l3 3"/></svg><span>Manuscrit</span></button>
  </nav>

  <div class="peek" id="peek" hidden></div>
  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="data.js"></script>
<script src="terrain.js"></script>
<script src="core.js"></script>
<script src="render3d.js"></script>
<script src="view-entries.js"></script>
<script src="view-graph.js"></script>
<script src="view-map.js"></script>
<script src="view-write.js"></script>
<script src="ai.js"></script>
<script src="app.js"></script>
