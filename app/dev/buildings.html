<!doctype html><html><head><meta charset="utf-8"><title>banc d'essai — bâtiments</title></head><body>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="../look.js"></script><script src="stage.js"></script><script src="../kit-buildings.js"></script>
<script>
// Banc d'essai du kit « bâtiments ». Vues : ?view=street | landmarks | close | town (300 maisons) | atlas
const q = new URLSearchParams(location.search), view = q.get('view') || 'street';
const KB = KIT_BUILDINGS;
const WALLS = ['#f4efe4', '#efe6d2', '#f3e2bf', '#e9c99a', '#f1d7c4', '#dfe8ec', '#e6ecd9', '#f2e6a8', '#ead0cf', '#f7f4ec', '#d9e3ea', '#f0dcb0'];
const SLATES = ['#5b6876', '#56636f', '#64707c', '#4f5c6a', '#6a7480'];
const TILES = ['#c4603e', '#b9573f', '#cc6a45'];
let seedN = 1;
const R = () => { seedN = (seedN * 16807) % 2147483647; return seedN / 2147483647; };
const pickR = (a) => a[Math.floor(R() * a.length)];
const roofPick = () => (R() < 0.25 ? pickR(TILES) : pickR(SLATES));

function road(scene, pts, width, color) {
  // ruban plat le long d'une polyligne
  const pos = [];
  for (let i = 0; i < pts.length - 1; i++) {
    const [ax, az] = pts[i], [bx, bz] = pts[i + 1], tx = bx - ax, tz = bz - az, l = Math.hypot(tx, tz), nx = -tz / l * width / 2, nz = tx / l * width / 2;
    pos.push(ax + nx, 0.03, az + nz, bx + nx, 0.03, bz + nz, bx - nx, 0.03, bz - nz, ax + nx, 0.03, az + nz, bx - nx, 0.03, bz - nz, ax - nx, 0.03, az - nz);
  }
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); g.computeVertexNormals();
  const m = new THREE.Mesh(g, new THREE.MeshStandardMaterial({ color: LOOK.lin(color), roughness: 1, side: THREE.DoubleSide })); m.receiveShadow = true; scene.add(m);
}

// rangée de maisons de part et d'autre d'une rue en arc
function street(kit, cx, cz, radius, a0, a1, opts) {
  const o = Object.assign({ half: 3.0, floorsMax: 4, cottages: true }, opts || {});
  const pts = [];
  const L = radius * Math.abs(a1 - a0), n = Math.floor(L / 4.72);
  for (let i = 0; i <= 40; i++) { const a = a0 + (a1 - a0) * i / 40; pts.push([cx + Math.sin(a) * radius, cz + Math.cos(a) * radius]); }
  let count = 0;
  for (const side of [-1, 1]) {
    for (let i = 0; i < n; i++) {
      const a = a0 + (a1 - a0) * (i + 0.5) / n;
      const d = 3.4 + R() * 0.8, r = radius + side * (o.half + d / 2);
      const x = cx + Math.sin(a) * r, z = cz + Math.cos(a) * r;
      // la façade regarde la rue : vers le centre de l'arc pour le côté extérieur
      const fx = -Math.sin(a) * side, fz = -Math.cos(a) * side;
      const end = o.cottages && (i < 2 || i >= n - 2);
      const floors = end ? 1 : Math.min(o.floorsMax, 2 + Math.floor(R() * 2.6));
      if (end && R() < 0.3) continue;
      kit.addHouse({ x, y: 0, z, rotY: Math.atan2(fx, fz), w: 4.75, d, floors, wall: pickR(WALLS), roof: roofPick(), seed: 1000 + count * 7 + side });
      count++;
    }
  }
  return { pts, count };
}

let st;
if (view === 'landmarks') {
  st = STAGE({ target: [0, 10, 0], dist: 135, theta: 0.35, phi: 1.12 });
  const kit = KB.create({ maxHouses: 10 }); st.scene.add(kit.group);
  ['phare', 'eglise', 'halle', 'moulin', 'tour', 'statue'].forEach((k, i) => {
    const lm = kit.landmark(k, { seed: 3 + i }); lm.group.position.set((i - 2.5) * 30, 0, 0); st.scene.add(lm.group); if (lm.animate) lm.animate(st.time);
  });
} else if (view === 'close') {
  st = STAGE({ target: [0, 4.5, 0], dist: 30, theta: 0.42, phi: 1.32 });
  const kit = KB.create({ maxHouses: 20 }); st.scene.add(kit.group);
  const specs = [[1, '#f4efe4', SLATES[0], 1], [3, '#f3e2bf', SLATES[1], 2], [2, '#dfe8ec', TILES[0], 3], [4, '#f1d7c4', SLATES[2], 4], [2, '#e6ecd9', SLATES[3], 5], [3, '#e9c99a', TILES[1], 6]];
  specs.forEach(([f, wall, roof, s], i) => kit.addHouse({ x: (i - 2.5) * 4.72, y: 0, z: 0, rotY: 0, w: 4.75, d: 3.8, floors: f, wall, roof, seed: s * 31 + (+q.get('seed') || 0) }));
  kit.commit();
  road(st.scene, [[-40, 4.6], [40, 4.6]], 5.6, '#b4a58c');
} else if (view === 'town') {
  st = STAGE({ target: [0, 0, 0], dist: 300, theta: 0.5, phi: 0.95 });
  const kit = KB.create({ maxHouses: 3000 }); st.scene.add(kit.group);
  let n = 0;
  for (let k = 0; k < 7 && n < 300; k++) {
    const r = 40 + k * 22, s = street(kit, 0, 0, r, -0.9 - k * 0.05, 0.9 + k * 0.05, { cottages: k > 4 });
    road(st.scene, s.pts, 5.6, '#b4a58c'); n += s.count;
  }
  kit.commit(); window.HOUSES = n;
  const lm = kit.landmark('eglise', { seed: 2 }); lm.group.position.set(0, 0, 0); lm.group.rotation.y = PI_(); st.scene.add(lm.group);
} else if (view === 'atlas') {
  st = STAGE({ target: [0, 0, 0], dist: 60, theta: 0, phi: 0.001, ground: null });
  const kit = KB.create({ maxHouses: 1 });
  const m = new THREE.Mesh(new THREE.PlaneGeometry(80, 40), new THREE.MeshBasicMaterial({ map: kit.material.map, transparent: true })); m.rotation.x = -Math.PI / 2; st.scene.add(m);
} else {
  st = STAGE({ target: [-6, 3, 89], dist: 58, theta: 1.85, phi: 1.02 });
  const kit = KB.create({ maxHouses: 200 }); st.scene.add(kit.group);
  const s = street(kit, 0, 0, 90, -0.45, 0.45);
  kit.commit(); window.HOUSES = s.count;
  road(st.scene, s.pts, 6.0, '#b4a58c');
}
function PI_() { return Math.PI; }
st.done();
</script>
</body></html>
