<!doctype html><html><head><meta charset="utf-8"><title>banc d'essai — kit rue</title></head><body>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="../look.js"></script><script src="stage.js"></script><script src="../kit-street.js"></script>
<script>
// Banc d'essai du kit « rue » : ?view=rue | place | port | gens (&t=1.3 fige le pas des habitants).
const q = new URLSearchParams(location.search), view = q.get('view') || 'rue';
const CAM = {
  rue: { target: [0, 1, 0], dist: 34, theta: 0.55, phi: 0.98 },
  place: { target: [8, 0, 0], dist: 58, theta: 0.45, phi: 0.92 },
  port: { target: [6, 1, -4], dist: 52, theta: 0.6, phi: 0.98, ground: null },
  gens: { target: [0, 0.75, 0], dist: 7.5, theta: 0.35, phi: 1.2, fov: 40 },
}[view] || {};
const st = STAGE(CAM), K = KIT_STREET, kit = K.create({ maxProps: 400, maxPeople: 120 });
st.scene.add(kit.group);
let seed = 1; const R = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
const CLOTHES = ['#27324a', '#3a4f7a', '#8c3b2e', '#c9a24a', '#5d6e4a', '#1f1f22', '#e8e0cc', '#6b4a6e', '#b85c38', '#2f5d6b', '#8a8f96', '#a3473f'];

// ruban posé au sol : u en travers, v = distance / largeur
function ribbon(pts, width, kind, y) {
  const d = []; for (let i = 0; i < pts.length - 1; i++) { const [a, b] = [pts[i], pts[i + 1]], n = Math.ceil(Math.hypot(b[0] - a[0], b[1] - a[1]) / 0.8); for (let k = 0; k < n; k++) d.push([a[0] + ((b[0] - a[0]) * k) / n, a[1] + ((b[1] - a[1]) * k) / n]); }
  d.push(pts[pts.length - 1]);
  const pos = [], uv = [], idx = []; let L = 0;
  d.forEach(([x, z], i) => {
    const p = d[Math.max(0, i - 1)], qq = d[Math.min(d.length - 1, i + 1)], tx = qq[0] - p[0], tz = qq[1] - p[1], l = Math.hypot(tx, tz) || 1, nx = -tz / l, nz = tx / l;
    if (i) L += Math.hypot(x - d[i - 1][0], z - d[i - 1][1]);
    pos.push(x - nx * width / 2, y || 0.02, z - nz * width / 2, x + nx * width / 2, y || 0.02, z + nz * width / 2); uv.push(0, L / width, 1, L / width);
    if (i) { const a = (i - 1) * 2; idx.push(a, a + 1, a + 2, a + 1, a + 3, a + 2); }
  });
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2)); g.setIndex(idx); g.computeVertexNormals();
  const m = new THREE.Mesh(g, K.groundMaterial(kind)); m.receiveShadow = true; st.scene.add(m); return d;
}
// surface : UV = monde / 8
function area(geo, kind, y) { geo.rotateX(-Math.PI / 2); geo.translate(0, y || 0.02, 0); const p = geo.attributes.position, uv = geo.attributes.uv; for (let i = 0; i < p.count; i++) uv.setXY(i, p.getX(i) / 8, p.getZ(i) / 8); const m = new THREE.Mesh(geo, K.groundMaterial(kind)); m.receiveShadow = true; st.scene.add(m); return m; }
function areaAt(geo, kind, cx, cz, y) { geo.rotateX(-Math.PI / 2); geo.translate(cx, y || 0.02, cz); const p = geo.attributes.position, uv = geo.attributes.uv; for (let i = 0; i < p.count; i++) uv.setXY(i, p.getX(i) / 8, p.getZ(i) / 8); const m = new THREE.Mesh(geo, K.groundMaterial(kind)); m.receiveShadow = true; st.scene.add(m); return m; }
// maisons de contexte (simples volumes chaulés à toit d'ardoise, pour l'échelle)
const houseMat = new THREE.MeshStandardMaterial({ color: LOOK.lin('#eee8dc'), roughness: 0.95 }), roofMat = new THREE.MeshStandardMaterial({ color: LOOK.lin('#56606b'), roughness: 0.8 });
function house(x, z, ry, w, floors) {
  const g = new THREE.Group(), h = floors * 2.5, d = 5;
  const b = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), houseMat); b.position.y = h / 2; g.add(b);
  const sh = new THREE.Shape([new THREE.Vector2(-d / 2 - 0.3, 0), new THREE.Vector2(d / 2 + 0.3, 0), new THREE.Vector2(0, 2.6)]), rg = new THREE.ExtrudeGeometry(sh, { depth: w + 0.3, bevelEnabled: false });
  rg.translate(0, 0, -(w + 0.3) / 2); const r = new THREE.Mesh(rg, roofMat); r.rotation.y = Math.PI / 2; r.position.y = h; g.add(r);
  g.traverse((o) => { o.castShadow = o.receiveShadow = true; }); g.position.set(x, 0, z); g.rotation.y = ry; st.scene.add(g);
}
function person(i, x, z, ry, o) {
  o = o || {};
  kit.people.set(i, { x, y: o.y || 0, z, rotY: ry, scale: o.scale || 1, moving: o.moving != null ? o.moving : R() < 0.75, phase: R() * 6.283, color: o.color || CLOTHES[Math.floor(R() * CLOTHES.length)], variant: o.variant != null ? o.variant : Math.floor(R() * 4), named: !!o.named, seed: i * 7 + 3 });
}

if (view === 'rue') {
  const path = [[-34, 4], [-18, 1], [-4, -1.5], [10, -0.5], [22, 2.5], [34, 2]], Wd = 3.2;
  const d = ribbon(path, Wd, 'pave');
  ribbon([[-6, -1.6], [-7, -14], [-10, -26]], 2.6, 'pave');
  // façades des deux côtés
  for (let i = 3; i < d.length - 3; i += 6) {
    const [x, z] = d[i], [x2, z2] = d[i + 1], a = Math.atan2(z2 - z, x2 - x), nx = -Math.sin(a), nz = Math.cos(a);
    for (const s of [-1]) if (!(s < 0 && Math.abs(x + 6.5) < 5)) house(x + nx * s * 5.6, z + nz * s * 5.6, -a, 4.6, 1 + ((i >> 2) % 2));
  }
  // mobilier le long de la rue
  let n = 0;
  for (let i = 4; i < d.length - 2; i += 2) {
    const [x, z] = d[i], [x2, z2] = d[i + 1], a = Math.atan2(z2 - z, x2 - x), nx = -Math.sin(a), nz = Math.cos(a), s = (i >> 1) % 2 ? 1 : -1, ry = -a;
    const k = (i >> 1) % 7, off = Wd / 2 + 0.55;
    if (k === 0) kit.addProp('lampadaire', x + nx * s * off, 0, z + nz * s * off, ry);
    else if (k === 2) kit.addProp('banc', x + nx * s * (off + 0.5), 0, z + nz * s * (off + 0.5), ry + (s > 0 ? Math.PI : 0));
    else if (k === 3) kit.addProp('jardiniere', x + nx * s * (off + 1.4), 0, z + nz * s * (off + 1.4), ry);
    else if (k === 4) kit.addProp('tonneau', x + nx * s * (off + 1.2), 0, z + nz * s * (off + 1.2), 0);
    else if (k === 5) kit.addProp('caisses', x + nx * s * (off + 1.0), 0, z + nz * s * (off + 1.0), ry + 0.3);
    else if (k === 6) kit.addProp('jardiniere', x + nx * s * (off + 1.4), 0, z + nz * s * (off + 1.4), ry);
  }
  kit.addProp('charrette', 3, 0, 1.9, 0.2);
  kit.addProp('puits', -6.5, 0, -6, 0);
  kit.addProp('fanion', 1, 0, -0.9, Math.PI / 2 - 0.05);
  kit.addProp('fanion', 14, 0, 0.3, Math.PI / 2 - 0.2, { tint: '#2b5fa8' });
  for (let i = 0; i < 4; i++) kit.addProp('muret', -32 + i * 2, 0, -2, 0);
  for (let i = 0; i < 4; i++) kit.addProp('cloture', 26 + i * 2, 0, 6.5, 0);
  // habitants
  for (let i = 0; i < 32; i++) {
    const j = 3 + Math.floor(R() * (d.length - 6)), [x, z] = d[j], [x2, z2] = d[j + 1], a = Math.atan2(z2 - z, x2 - x), nx = -Math.sin(a), nz = Math.cos(a), o = (R() - 0.5) * 2.4, dir = R() < 0.5 ? 0 : Math.PI;
    person(n++, x + nx * o, z + nz * o, Math.PI / 2 - a + dir, { named: i % 11 === 0 });
  }
  kit.people.count = n;
} else if (view === 'place') {
  areaAt(new THREE.CircleGeometry(7.5, 48), 'place', 0, 0, 0.03);
  ribbon([[-7, 0], [-30, -2]], 3.2, 'pave'); ribbon([[0, -7], [1, -30]], 3, 'pave'); ribbon([[-1, 7], [-3, 30]], 3, 'pave');
  ribbon([[7, 0], [9.5, 0]], 3, 'pave');
  areaAt(new THREE.PlaneGeometry(26, 26, 1, 1), 'parc', 22.5, 0, 0.025);
  ribbon([[9.5, 0], [14, 1.5], [18, 6.5], [22, 9], [30, 9.5], [35.5, 8]], 2.2, 'sentier', 0.035);
  ribbon([[14, 1.5], [17, -2], [21, -8.5], [27, -10], [35.5, -9]], 2.0, 'sentier', 0.035);
  ribbon([[36, -14], [36.5, 0], [37, 14], [38, 30]], 3.2, 'route', 0.02);
  const f = K.fontaine(1.6); st.scene.add(f.group);
  const b = K.bassin(3.6); b.group.position.set(25, 0, -1.5); st.scene.add(b.group);
  const k = K.kiosque(); k.group.position.set(18.5, 0, 9.6); k.group.rotation.y = Math.PI - 0.5; st.scene.add(k.group);
  const tints = ['#b8322a', '#2f5d8c', '#2f7a52', '#d39a2c', '#7a3b6e'];
  [[-2.4, 0.4], [-1.6, -0.6], [-0.4, 0.2], [2.6, -0.3], [3.4, 0.3]].forEach(([a, dd], i) => { const r = 5.0 + dd * 0.2; kit.addProp('etal', Math.cos(a) * r, 0, Math.sin(a) * r, -a - Math.PI / 2, { tint: tints[i] }); });
  kit.addProp('fanion', 0, 0, -3.6, 0.15); kit.addProp('fanion', -3.4, 0, 2.6, -0.9, { tint: '#2b5fa8' });
  for (let i = 0; i < 6; i++) { const a = (i / 6) * 6.283 + 0.26; kit.addProp('lampadaire', Math.cos(a) * 7.8, 0, Math.sin(a) * 7.8, -a); }
  for (const a of [0.9, 2.2, 4.0, 5.4]) kit.addProp('banc', Math.cos(a) * 3.1, 0, Math.sin(a) * 3.1, -a - Math.PI / 2);
  for (const [x, z] of [[-4, -5.2], [4.5, 5]]) { kit.addProp('tonneau', x, 0, z, 0); kit.addProp('caisses', x + 0.9, 0, z + 0.3, 1); }
  kit.addProp('charrette', -5.5, 0, 4.2, 2.3);
  for (const [x, z, r] of [[10.3, -4, 0], [10.3, 4.5, 0], [13.5, -2.5, 0.5]]) kit.addProp('jardiniere', x, 0, z, r);
  for (let i = 0; i < 12; i++) kit.addProp('cloture', 10.5 + i * 2, 0, -13, 0);
  for (let i = 0; i < 6; i++) { kit.addProp('cloture', 9.5, 0, -12 + i * 2, Math.PI / 2); }
  for (let i = 0; i < 6; i++) kit.addProp('cloture', 9.5, 0, 3.5 + i * 2, Math.PI / 2);
  for (const [x, z, r] of [[16, -4.5, 0.5], [30, 4, 2.5], [22, 4.5, 3.2]]) kit.addProp('banc', x, 0, z, r);
  for (let i = 0; i < 4; i++) kit.addProp('lampadaire', 12 + i * 7, 0, i % 2 ? 7 : -6, 0);
  for (let i = 0; i < 10; i++) kit.addProp('muret', -7 - i * 2, 0, -6, 0);
  kit.addProp('puits', -10, 0, 4.5, 0.3);
  let n = 0;
  for (let i = 0; i < 46; i++) { const a = R() * 6.283, r = 2.2 + R() * 4.6; person(n++, Math.cos(a) * r, Math.sin(a) * r, R() * 6.283, { named: i % 9 === 0 }); }
  for (let i = 0; i < 14; i++) { const t = R(), x = 14 + t * 18, z = 1.5 + t * 7 + (R() - 0.5); person(n++, x, z, 1.2, { named: i === 3 }); }
  kit.people.count = n;
} else if (view === 'port') {
  const water = new THREE.Mesh(new THREE.PlaneGeometry(400, 400), K.material('water')); water.rotation.x = -Math.PI / 2; water.position.y = 0; st.scene.add(water);
  const sea = new THREE.Mesh(new THREE.PlaneGeometry(400, 400), new THREE.MeshStandardMaterial({ color: LOOK.lin('#2c5560'), roughness: 1 })); sea.rotation.x = -Math.PI / 2; sea.position.y = -3; st.scene.add(sea);
  const landMat = new THREE.MeshStandardMaterial({ color: LOOK.lin('#9cc56a'), roughness: 1 }), bank = K.material('stone');
  function land(x0, x1, z0, z1) {
    const g = new THREE.BoxGeometry(x1 - x0, 6, z1 - z0); g.translate((x0 + x1) / 2, 1.4 - 3, (z0 + z1) / 2);
    const p = g.attributes.position, uv = g.attributes.uv, nn = g.attributes.normal, col = [];
    for (let i = 0; i < p.count; i++) { const ax = Math.abs(nn.getX(i)) > 0.5; uv.setXY(i, (ax ? p.getZ(i) : p.getX(i)) / 2, p.getY(i) / 2); const c = LOOK.lin('#b5b0a6'); col.push(c.r, c.g, c.b); }
    g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3)); g.setAttribute('aFx', new THREE.Float32BufferAttribute(new Float32Array(p.count * 2), 2));
    const m = new THREE.Mesh(g, bank); m.receiveShadow = m.castShadow = true; st.scene.add(m);
    const top = new THREE.Mesh(new THREE.PlaneGeometry(x1 - x0, z1 - z0), landMat); top.rotation.x = -Math.PI / 2; top.position.set((x0 + x1) / 2, 1.405, (z0 + z1) / 2); top.receiveShadow = true; st.scene.add(top);
  }
  land(-60, 26, -60, -1.5); land(34, 90, -60, -1.5);
  ribbon([[-40, -4.4], [26, -4.4]], 4.6, 'pave', 1.43); ribbon([[34, -4.4], [70, -4.4]], 4.6, 'pave', 1.43);
  ribbon([[-6, -6.7], [-7, -30]], 3, 'pave', 1.43);
  const qd = K.quai(30); qd.group.position.set(-12, 0, 0.2); st.scene.add(qd.group);
  const b1 = K.bateau(0), b2 = K.bateau(1), b3 = K.bateau(2);
  b1.group.position.set(-2, 0, 4.0); b1.group.rotation.y = 0.04; b2.group.position.set(9, 0, 4.3); b2.group.rotation.y = Math.PI - 0.05; b3.group.position.set(15.5, 0, 3.0); b3.group.rotation.y = 0.5;
  for (const b of [b1, b2, b3]) { st.scene.add(b.group); b.animate(st.time); }
  const p = K.pont(9, 5); p.group.position.set(30, 1.4, -6); st.scene.add(p.group);
  for (let i = 0; i < 6; i++) { kit.addProp('muret', 25.2, 1.4, -10.5 - i * 2, Math.PI / 2); kit.addProp('muret', 34.8, 1.4, -10.5 - i * 2, Math.PI / 2); }
  for (const x of [-8, 2, 12, 22]) kit.addProp('lampadaire', x, 1.4, -2.4, 0);
  kit.addProp('lampadaire', 26.2, 1.4, -3.6, 0); kit.addProp('lampadaire', 33.8, 1.4, -8.4, 0);
  for (const [x, kd] of [[-4, 'tonneau'], [-3.2, 'tonneau'], [5, 'caisses'], [16, 'charrette'], [-10, 'caisses']]) kit.addProp(kd, x, 1.4, -6.9, 0.2);
  kit.addProp('banc', 7, 1.4, -6.8, 0); kit.addProp('etal', 0, 1.4, -7.4, 0, { tint: '#2f5d8c' });
  for (let i = 0; i < 4; i++) house(-14 + i * 5, -12, 0, 4.6, 2);
  house(40, -12, 0, 4.6, 2); house(45, -12, 0, 4.6, 1);
  let n = 0;
  for (let i = 0; i < 26; i++) { const x = -12 + R() * 40, z = R() < 0.4 ? -1.2 + R() * 2.4 : -6 + R() * 3.2; person(n++, x, z, R() < 0.5 ? 1.57 : -1.57, { y: 1.4, named: i % 10 === 0 }); }
  for (let i = 0; i < 4; i++) person(n++, 28 + R() * 4, -5 - R() * 2, 1.57, { y: 1.4 });
  kit.people.count = n;
} else {
  areaAt(new THREE.PlaneGeometry(16, 16), 'place', 0, 0, 0.02);
  ribbon([[-8, 2.2], [8, 2.2]], 3, 'pave', 0.03);
  let n = 0;
  for (let i = 0; i < 12; i++) {
    const row = Math.floor(i / 6), x = -2.9 + (i % 6) * 1.16, z = row ? -0.6 : 0.9;
    person(n++, x, z, row ? 0.6 - (i % 3) * 0.3 : (i % 2 ? 0.3 : -0.4), { variant: i % 4, moving: i % 3 !== 2, named: i === 1 || i === 8, color: CLOTHES[i] });
  }
  kit.addProp('lampadaire', 3.9, 0, -1.6, 0); kit.addProp('banc', -4.2, 0, -1.8, 0.3); kit.addProp('jardiniere', 4.2, 0, 1, -0.4);
  kit.people.count = n;
}
kit.commit(); kit.people.commit(); kit.people.update(st.time);
st.done();
window.STATS.props = K.propTriangles();
</script>
