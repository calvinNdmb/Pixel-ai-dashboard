<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1b1d2a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
    <title>Manette · Pixel Voice</title>
    <link rel="stylesheet" href="manette.css" />
  </head>
  <body>
    <header class="top">
      <h1>Manette</h1>
      <span id="conn" class="conn">Connexion…</span>
    </header>

    <main>
      <p id="empty" class="empty" hidden></p>

      <section id="controls">
        <section class="block">
          <div class="block-head">
            <h2>Tu es</h2>
            <button id="change-me" class="link" type="button">Changer</button>
          </div>
          <div id="me" class="me"></div>
        </section>

        <section class="block">
          <div class="block-head">
            <h2>Cible</h2>
            <span class="keys"><kbd>1</kbd>…<kbd>9</kbd> <kbd>←</kbd><kbd>→</kbd></span>
          </div>
          <div id="targets" class="chips"></div>
        </section>

        <section class="block">
          <h2>Sur la cible</h2>
          <div id="target-actions" class="grid"></div>
        </section>

        <section class="block">
          <h2>Ton perso</h2>
          <div id="self-actions" class="grid"></div>
        </section>

        <section class="block">
          <h2>Réactions</h2>
          <div id="emotes" class="grid emotes"></div>
        </section>
      </section>
    </main>

    <div id="picker" class="picker" hidden>
      <div class="picker-box">
        <h2>Qui es-tu ?</h2>
        <p>Choisis ton perso parmi les gens du salon vocal.</p>
        <div id="picker-list" class="chips"></div>
      </div>
    </div>

    <div id="toast" class="toast" hidden></div>
    <script type="module" src="manette.js"></script>
  </body>
</html>
