// Pixel's native parts (Kotlin, Expo Modules API): the share screen, the notification listener, their settings.
plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.mopi.pixelnative'
version = '1.2.0'

android {
  namespace "com.mopi.pixelnative"
  defaultConfig {
    versionCode 3
    versionName "1.2.0"
  }
}
